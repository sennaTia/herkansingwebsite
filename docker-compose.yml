version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile-php
    container_name: php_web2
    ports:
      - "8081:80"
    volumes:
      - ./php:/var/www/html     # Zorg dat jouw PHP-bestanden in de map 'php' staan
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql_db2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_web2
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
